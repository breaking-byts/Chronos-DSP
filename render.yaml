# Render Blueprint for Chronos DSP.
#
# Deploy:
#   1. Push this repository to GitHub/GitLab.
#   2. In Render: New -> Blueprint, select the repo.
#   3. Review the service name/region below before applying.
#
# SECRET_KEY_BASE is generated by Render. PHX_HOST is filled in from the
# service's own hostname. TLS is terminated by Render and forwarded via
# X-Forwarded-Proto, so FORCE_SSL=true adds redirects + HSTS.

services:
  - type: web
    name: chronos-dsp
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: PHX_HOST
        fromService:
          type: web
          name: chronos-dsp
          property: host
      - key: PHX_SCHEME
        value: https
      - key: FORCE_SSL
        value: "true"
      - key: PHX_SERVER
        value: "true"
      - key: LANG
        value: C.UTF-8
      # PORT is intentionally not set: Render injects it and the release binds
      # to it (config/runtime.exs reads PORT, default 4000).
