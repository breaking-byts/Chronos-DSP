name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  elixir:
    name: Elixir / OTP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Cache Mix and native artifacts
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            native/chronos_dsp/target
          key: ${{ runner.os }}-beam-${{ hashFiles('.tool-versions', 'mix.lock', 'native/chronos_dsp/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: NIF diagnostics
        run: |
          ls -la priv/native
          file priv/native/chronos_dsp.so || true
          ldd priv/native/chronos_dsp.so || true
          mix run --no-start -e 'IO.inspect(%{loaded: Chronos.DSP.nif_loaded?(), nif_version: :erlang.system_info(:nif_version), otp: System.otp_release(), elixir: System.version()})'

      - name: NIF probe (diagnostic)
        run: mix run --no-start scripts/nif_probe.exs

      - name: DSP parity (diagnostic)
        run: mix test test/chronos/dsp_parity_test.exs --trace

      - name: Test
        run: mix test --trace

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/chronos_dsp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: native/chronos_dsp/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/chronos_dsp/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test
